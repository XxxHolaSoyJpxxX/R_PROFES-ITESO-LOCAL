<div class="login-container">
  <div class="login-card-wrapper">

    <!-- Logo ITESO -->
    <div class="logo-wrapper">
      <img
        src="https://oci02.img.iteso.mx/Identidades-De-Instancia/ITESO/Logos%20ITESO/Logo-ITESO-Principal-FondoAzul.png"
        alt="ITESO Logo"
      />
    </div>

    <!-- Tarjeta -->
    <div class="login-card">
      <h1 class="title">Iniciar Sesión</h1>

      <!-- Mensaje de error -->
      <div class="error-msg" *ngIf="error">
        {{ error }}
      </div>

      <!-- Formulario -->
      <div class="form-group">
        <label for="email">Correo institucional</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          placeholder="usuario@iteso.mx"
          (keyup.enter)="login()"
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          placeholder="••••••••"
          (keyup.enter)="login()"
          autocomplete="current-password"
        />
      </div>

      <button class="login-btn" (click)="login()" [disabled]="loading">
        <span *ngIf="!loading">Entrar</span>
        <span *ngIf="loading">Iniciando sesión...</span>
      </button>

      <p class="footer-text">Sistema de evaluación docente · ITESO</p>
    </div>

  </div>
</div>
