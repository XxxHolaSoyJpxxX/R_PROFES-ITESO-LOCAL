name: CI — ITESO Evaluación Docente

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1: Validar docker-compose
  # ──────────────────────────────────────────────────────────────────────────
  validate-compose:
    name: Validar docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Crear .env mínimo para validación
        run: |
          cat > .env << 'ENV'
          RDB_HOST=mysql
          RDB_USER=iteso_user
          RDB_PASSWORD=iteso_password
          RDB_NAME=iteso_db
          RDB_PORT=3306
          MONGO_URI=mongodb://root:rootpassword@mongodb:27017/iteso_nube?authSource=admin
          MINIO_ENDPOINT=http://minio:9000
          AWS_REGION=us-east-1
          AWS_ACCESS_KEY_ID=minioadmin
          AWS_SECRET_ACCESS_KEY=minioadmin123
          AWS_BUCKET_NAME=iteso-archivos
          KEYCLOAK_ISSUER=http://keycloak:8080/realms/iteso
          KEYCLOAK_CLIENT_ID=iteso-backend
          KEYCLOAK_CLIENT_SECRET=iteso-secret-local
          GOOGLE_CLIENT_ID=iteso-backend
          GOOGLE_CLIENT_SECRET=iteso-secret-local
          GOOGLE_REDIRECT_URI=http://localhost:3000/auth/google/callback
          JWT_SECRET=ci-secret-64-chars-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          SMTP_HOST=mailpit
          SMTP_PORT=1025
          EMAIL_SENDER=sistema@iteso.mx
          EMAIL_RECIPIENT=notificaciones@iteso.mx
          NODE_ENV=development
          PORT=3000
          ENV

      - name: Validar sintaxis (prod)
        run: docker compose --profile prod config --quiet

      - name: Validar sintaxis (dev)
        run: docker compose --profile dev config --quiet

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 2: SAST — análisis estático de seguridad
  # ──────────────────────────────────────────────────────────────────────────
  sast:
    name: SAST — Snyk + npm audit + ESLint Security
    runs-on: ubuntu-latest
    needs: [validate-compose]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # ── npm audit — detecta CVEs en dependencias ──────────────────────────
      - name: npm audit — backend
        working-directory: backend
        run: |
          npm ci --prefer-offline
          echo "### npm audit backend ###"
          npm audit --audit-level=critical
          # Falla solo en vulnerabilidades CRÍTICAS reales

      - name: npm audit — frontend
        working-directory: frontend
        run: |
          npm ci --prefer-offline
          echo "### npm audit frontend ###"
          npm audit --audit-level=critical
          # Usamos critical (no high) porque Angular/Vite tienen high en devDependencies
          # que no afectan el runtime del sitio desplegado

      # ── ESLint Security — patrones peligrosos en código ───────────────────
      - name: ESLint Security — instalar
        working-directory: backend
        run: npm install --save-dev eslint@8 eslint-plugin-security

      - name: ESLint Security — crear config
        working-directory: backend
        run: |
          cat > .eslintrc.json << 'EOF'
          {
            "env": { "node": true, "es2020": true },
            "plugins": ["security"],
            "rules": {
              "security/detect-eval-with-expression": "error",
              "security/detect-non-literal-regexp": "warn",
              "security/detect-object-injection": "warn",
              "security/detect-non-literal-fs-filename": "warn"
            }
          }
          EOF

      - name: ESLint Security — escanear
        working-directory: backend
        run: |
          echo "### ESLint Security scan ###"
          npx eslint ./src --format stylish || true
          # warn no falla el pipeline; solo detect-eval-with-expression (error) lo haría

      # ── Snyk — SAST completo (requiere SNYK_TOKEN en secrets) ────────────
      - name: Snyk — instalar CLI
        run: npm install -g snyk

      - name: Snyk — verificar token disponible
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "⚠️  SNYK_TOKEN no configurado — saltando análisis Snyk"
            echo "   Configurar en: Settings → Secrets → SNYK_TOKEN"
          else
            echo "✓ SNYK_TOKEN disponible"
          fi
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk Code — análisis backend
        if: ${{ secrets.SNYK_TOKEN != '' }}
        working-directory: backend
        run: |
          echo "### Snyk Code SAST ###"
          snyk code test . --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      - name: Snyk Open Source — dependencias backend
        if: ${{ secrets.SNYK_TOKEN != '' }}
        working-directory: backend
        run: |
          echo "### Snyk OSS backend ###"
          snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      - name: Snyk Open Source — dependencias frontend
        if: ${{ secrets.SNYK_TOKEN != '' }}
        working-directory: frontend
        run: |
          echo "### Snyk OSS frontend ###"
          snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      # ── Generar reportes ──────────────────────────────────────────────────
      - name: Generar reporte npm audit JSON
        working-directory: backend
        run: npm audit --json > ../npm-audit-report.json || true

      - name: Subir reportes SAST
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-reports
          path: npm-audit-report.json

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 3: Backend — Lint + Tests + Build
  # ──────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend — Lint, Tests & Build
    runs-on: ubuntu-latest
    needs: [validate-compose]
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint TypeScript — chequeo de tipos
        run: npx tsc --noEmit

      - name: Tests unitarios — Jest (18 tests)
        run: npx jest --config jest.config.json --coverage
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-jest
          AWS_BUCKET_NAME: iteso-archivos
          MINIO_ENDPOINT: http://localhost:9000
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin123
          AWS_REGION: us-east-1

      - name: Build (compilar a dist/)
        run: npm run build

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-backend
          path: backend/coverage/

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 4: Frontend — Lint + Build
  # ──────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest
    needs: [validate-compose]
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Build Angular (producción)
        run: npx ng build --configuration=production

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 5: Integración — Levantar servicios y probar endpoints reales
  # ──────────────────────────────────────────────────────────────────────────
  integration:
    name: Pruebas de integración (Docker Compose)
    runs-on: ubuntu-latest
    needs: [sast, backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Crear .env para CI
        run: |
          cat > .env << 'ENV'
          RDB_HOST=mysql
          RDB_USER=iteso_user
          RDB_PASSWORD=iteso_password
          RDB_NAME=iteso_db
          RDB_PORT=3306
          MONGO_URI=mongodb://root:rootpassword@mongodb:27017/iteso_nube?authSource=admin
          MINIO_ENDPOINT=http://minio:9000
          AWS_REGION=us-east-1
          AWS_ACCESS_KEY_ID=minioadmin
          AWS_SECRET_ACCESS_KEY=minioadmin123
          AWS_BUCKET_NAME=iteso-archivos
          KEYCLOAK_ISSUER=http://keycloak:8080/realms/iteso
          KEYCLOAK_CLIENT_ID=iteso-backend
          KEYCLOAK_CLIENT_SECRET=iteso-secret-local
          GOOGLE_CLIENT_ID=iteso-backend
          GOOGLE_CLIENT_SECRET=iteso-secret-local
          GOOGLE_REDIRECT_URI=http://localhost:3000/auth/google/callback
          JWT_SECRET=ci-secret-64-chars-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          SMTP_HOST=mailpit
          SMTP_PORT=1025
          EMAIL_SENDER=sistema@iteso.mx
          EMAIL_RECIPIENT=notificaciones@iteso.mx
          NODE_ENV=development
          PORT=3000
          ENV

      - name: Levantar infraestructura
        run: docker compose up -d mysql mongodb minio keycloak mailpit

      - name: Esperar MySQL (max 2.5 min)
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T mysql mysqladmin ping -u root -prootpassword --silent 2>/dev/null && echo "✓ MySQL listo" && break
            echo "Intento $i/30..."
            sleep 5
          done

      - name: Esperar MongoDB (max 1.5 min)
        run: |
          for i in $(seq 1 18); do
            docker compose exec -T mongodb mongosh --quiet --eval "db.adminCommand('ping').ok" 2>/dev/null | grep -q "1" && echo "✓ MongoDB listo" && break
            echo "Intento $i/18..."
            sleep 5
          done

      - name: Esperar Keycloak (max 5 min)
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health/ready 2>/dev/null && echo "✓ Keycloak listo" && break
            echo "Intento $i/30..."
            sleep 10
          done

      - name: Levantar backend
        run: docker compose --profile dev up -d backend-dev

      - name: Esperar backend (max 2 min)
        run: |
          for i in $(seq 1 24); do
            curl -sf http://localhost:3000/health 2>/dev/null && echo "✓ Backend listo" && break
            echo "Intento $i/24..."
            sleep 5
          done

      - name: Test 1 — GET /health devuelve 200
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health)
          [ "$STATUS" = "200" ] || (echo "FALLO: /health → $STATUS" && exit 1)
          echo "✓ /health → $STATUS"

      - name: Test 2 — GET /metrics devuelve 200
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/metrics)
          [ "$STATUS" = "200" ] || (echo "FALLO: /metrics → $STATUS" && exit 1)
          echo "✓ /metrics → $STATUS"

      - name: Test 3 — POST /api/auth/google sin token devuelve 400
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST http://localhost:3000/api/auth/google \
            -H "Content-Type: application/json" \
            -d '{}')
          [ "$STATUS" = "400" ] || (echo "FALLO: auth sin token → $STATUS (esperado 400)" && exit 1)
          echo "✓ Auth sin token → $STATUS"

      - name: Test 4 — Keycloak OIDC discovery disponible
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            http://localhost:8080/realms/iteso/.well-known/openid-configuration)
          [ "$STATUS" = "200" ] || (echo "FALLO: Keycloak OIDC → $STATUS" && exit 1)
          echo "✓ Keycloak OIDC discovery → $STATUS"

      - name: Test 5 — MinIO health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9000/minio/health/live)
          [ "$STATUS" = "200" ] || (echo "FALLO: MinIO → $STATUS" && exit 1)
          echo "✓ MinIO health → $STATUS"

      - name: Test 6 — Ruta inexistente devuelve 404
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/ruta-que-no-existe)
          [ "$STATUS" = "404" ] || (echo "FALLO: 404 esperado → $STATUS" && exit 1)
          echo "✓ Ruta inexistente → $STATUS"

      - name: Logs del backend si hay fallo
        if: failure()
        run: docker compose logs backend-dev --tail 80

      - name: Teardown
        if: always()
        run: docker compose --profile dev down -v

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 6: DAST — OWASP ZAP contra el backend real
  # ──────────────────────────────────────────────────────────────────────────
  dast:
    name: DAST — OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    needs: [integration]

    steps:
      - uses: actions/checkout@v4

      - name: Crear .env para CI
        run: |
          cat > .env << 'ENV'
          RDB_HOST=mysql
          RDB_USER=iteso_user
          RDB_PASSWORD=iteso_password
          RDB_NAME=iteso_db
          RDB_PORT=3306
          MONGO_URI=mongodb://root:rootpassword@mongodb:27017/iteso_nube?authSource=admin
          MINIO_ENDPOINT=http://minio:9000
          AWS_REGION=us-east-1
          AWS_ACCESS_KEY_ID=minioadmin
          AWS_SECRET_ACCESS_KEY=minioadmin123
          AWS_BUCKET_NAME=iteso-archivos
          KEYCLOAK_ISSUER=http://keycloak:8080/realms/iteso
          KEYCLOAK_CLIENT_ID=iteso-backend
          KEYCLOAK_CLIENT_SECRET=iteso-secret-local
          GOOGLE_CLIENT_ID=iteso-backend
          GOOGLE_CLIENT_SECRET=iteso-secret-local
          GOOGLE_REDIRECT_URI=http://localhost:3000/auth/google/callback
          JWT_SECRET=ci-secret-64-chars-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          SMTP_HOST=mailpit
          SMTP_PORT=1025
          EMAIL_SENDER=sistema@iteso.mx
          EMAIL_RECIPIENT=notificaciones@iteso.mx
          NODE_ENV=development
          PORT=3000
          ENV

      - name: Levantar infraestructura
        run: docker compose up -d mysql mongodb minio keycloak mailpit

      - name: Esperar servicios
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T mysql mysqladmin ping -u root -prootpassword --silent 2>/dev/null && break
            sleep 5
          done
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health/ready 2>/dev/null && break
            sleep 10
          done

      - name: Levantar backend
        run: docker compose --profile dev up -d backend-dev

      - name: Esperar backend
        run: |
          for i in $(seq 1 24); do
            curl -sf http://localhost:3000/health 2>/dev/null && break
            sleep 5
          done

      - name: Preparar directorio de reportes ZAP
        run: mkdir -p zap-report && chmod 777 zap-report

      - name: OWASP ZAP — Baseline Scan
        run: |
          docker run --rm --network host \
            -v $(pwd)/zap-report:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:3000 \
            -r report.html \
            -J report.json \
            -x report.xml \
            -I
          # -I: informa pero no falla por alertas WARN
          # El pipeline sí falla si ZAP no puede alcanzar el target
        continue-on-error: true

      - name: Resumen de alertas ZAP
        if: always()
        run: |
          echo "======================================"
          echo "       RESUMEN OWASP ZAP DAST         "
          echo "======================================"
          if [ -f zap-report/report.json ]; then
            python3 << 'PY'
          import json, sys

          with open('zap-report/report.json') as f:
              data = json.load(f)

          total = {'High': 0, 'Medium': 0, 'Low': 0, 'Informational': 0}
          findings = []

          for site in data.get('site', []):
              for alert in site.get('alerts', []):
                  risk = alert.get('riskdesc', 'Informational').split(' ')[0]
                  name = alert.get('name', 'Unknown')
                  count = int(alert.get('count', 0))
                  solution = alert.get('solution', 'N/A')[:120]
                  if risk in total:
                      total[risk] += count
                  findings.append((risk, name, count, solution))

          # Ordenar por severidad
          order = {'High': 0, 'Medium': 1, 'Low': 2, 'Informational': 3}
          findings.sort(key=lambda x: order.get(x[0], 4))

          print(f"\n{'Nivel':<15} {'Alertas':<10} {'Nombre'}")
          print("-" * 70)
          for risk, name, count, _ in findings:
              print(f"{risk:<15} {count:<10} {name}")

          print("\n--- TOTALES ---")
          print(f"  High:          {total['High']}")
          print(f"  Medium:        {total['Medium']}")
          print(f"  Low:           {total['Low']}")
          print(f"  Informational: {total['Informational']}")

          if total['High'] > 0:
              print(f"\n⚠️  Se encontraron {total['High']} alertas HIGH")
              print("   Revisar zap-report/report.html para detalles")
          else:
              print("\n✓ Sin alertas de nivel HIGH")
          PY
          else
            echo "No se encontró reporte JSON de ZAP"
          fi

      - name: Subir reporte DAST
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-zap-report
          path: zap-report/

      - name: Teardown
        if: always()
        run: docker compose --profile dev down -v