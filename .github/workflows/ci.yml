name: CI — ITESO Evaluación Docente

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1: Validar docker-compose
  # ──────────────────────────────────────────────────────────────────────────
  validate-compose:
    name: Validar docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar sintaxis (prod)
        run: docker compose --profile prod config --quiet

      - name: Validar sintaxis (dev)
        run: docker compose --profile dev config --quiet


  # ──────────────────────────────────────────────────────────────────────────
  # JOB 2b: SAST — Snyk + ESLint Security + npm audit
  # ──────────────────────────────────────────────────────────────────────────
  sast:
    name: SAST — Snyk, ESLint & npm audit
    runs-on: ubuntu-latest
    needs: [validate-compose]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Snyk — backend ────────────────────────────────────────────────────
      - name: Snyk — instalar CLI
        run: npm install -g snyk

      - name: Snyk — autenticar
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Snyk Code — análisis estático del código backend (SAST)
        run: snyk code test backend/
        continue-on-error: true
        # continue-on-error para no bloquear el pipeline en la primera ejecución
        # Quitar cuando se hayan revisado y resuelto los findings iniciales

      - name: Snyk Open Source — dependencias backend (SCA)
        run: snyk test --file=backend/package.json --severity-threshold=high
        continue-on-error: true

      - name: Snyk Open Source — dependencias frontend (SCA)
        run: snyk test --file=frontend/package.json --severity-threshold=high
        continue-on-error: true

      - name: Snyk — generar reporte JSON backend
        run: snyk code test backend/ --json > snyk-code-report.json || true

      - name: Snyk — generar reporte dependencias
        run: snyk test --file=backend/package.json --json > snyk-deps-report.json || true

      # ── npm audit ─────────────────────────────────────────────────────────
      - name: npm audit — backend
        working-directory: backend
        run: |
          npm ci
          npm audit --audit-level=high --json > ../npm-audit-backend.json || true
          npm audit --audit-level=high

      - name: npm audit — frontend
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high --json > ../npm-audit-frontend.json || true
          npm audit --audit-level=high
        continue-on-error: true

      # ── ESLint con plugin de seguridad ────────────────────────────────────
      - name: ESLint Security — instalar plugins
        working-directory: backend
        run: |
          npm install --save-dev eslint @typescript-eslint/parser @typescript-eslint/eslint-plugin eslint-plugin-security

      - name: ESLint Security — escanear backend
        working-directory: backend
        run: |
          npx eslint src/ \
            --parser @typescript-eslint/parser \
            --plugin security \
            --plugin @typescript-eslint \
            --rule 'security/detect-object-injection: warn' \
            --rule 'security/detect-non-literal-regexp: warn' \
            --rule 'security/detect-possible-timing-attacks: warn' \
            --rule 'security/detect-non-literal-fs-filename: warn' \
            --rule 'security/detect-eval-with-expression: error' \
            --format json --output-file ../eslint-security-report.json || true
          npx eslint src/ \
            --plugin security \
            --rule 'security/detect-eval-with-expression: error' \
            --rule 'security/detect-object-injection: warn' \
            --rule 'security/detect-non-literal-regexp: warn'
        continue-on-error: true

      # ── Subir todos los reportes ──────────────────────────────────────────
      - name: Subir reportes SAST
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-reports
          path: |
            snyk-code-report.json
            snyk-deps-report.json
            npm-audit-backend.json
            npm-audit-frontend.json
            eslint-security-report.json

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 2: Backend — Lint + Tests unitarios + Build
  # ──────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend — Lint, Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar dependencias de test
        run: npm install --save-dev jest ts-jest @types/jest

      - name: Lint TypeScript (chequeo de tipos)
        run: npx tsc --noEmit

      - name: Tests unitarios
        run: npx jest --config jest.config.json --coverage
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-jest
          AWS_BUCKET_NAME: iteso-archivos
          MINIO_ENDPOINT: http://localhost:9000
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin123
          AWS_REGION: us-east-1

      - name: Build (compilar a dist/)
        run: npm run build

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-backend
          path: backend/coverage/

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 3: Frontend — Lint + Tests unitarios + Build
  # ──────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — Lint, Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint Angular
        run: npx ng lint --max-warnings=0
        continue-on-error: true

      - name: Tests unitarios (Karma headless)
        run: npx ng test --watch=false --browsers=ChromeHeadless --code-coverage
        env:
          CHROME_BIN: /usr/bin/google-chrome

      - name: Build Angular (producción)
        run: npx ng build --configuration=production

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-frontend
          path: frontend/coverage/

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 4: Integración — Levantar servicios y probar endpoints reales
  # ──────────────────────────────────────────────────────────────────────────
  integration:
    name: Pruebas de integración (Docker Compose)
    runs-on: ubuntu-latest
    needs: [validate-compose, sast, backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Crear .env para CI
        run: |
          cat > .env << 'ENV'
          RDB_HOST=mysql
          RDB_USER=iteso_user
          RDB_PASSWORD=iteso_password
          RDB_NAME=iteso_db
          RDB_PORT=3306
          MONGO_URI=mongodb://root:rootpassword@mongodb:27017/iteso_nube?authSource=admin
          MINIO_ENDPOINT=http://minio:9000
          AWS_REGION=us-east-1
          AWS_ACCESS_KEY_ID=minioadmin
          AWS_SECRET_ACCESS_KEY=minioadmin123
          AWS_BUCKET_NAME=iteso-archivos
          KEYCLOAK_ISSUER=http://keycloak:8080/realms/iteso
          KEYCLOAK_CLIENT_ID=iteso-backend
          KEYCLOAK_CLIENT_SECRET=iteso-secret-local
          GOOGLE_CLIENT_ID=iteso-backend
          GOOGLE_CLIENT_SECRET=iteso-secret-local
          GOOGLE_REDIRECT_URI=http://localhost:3000/auth/google/callback
          JWT_SECRET=ci-secret-64-chars-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          SMTP_HOST=mailpit
          SMTP_PORT=1025
          EMAIL_SENDER=sistema@iteso.mx
          EMAIL_RECIPIENT=notificaciones@iteso.mx
          NODE_ENV=development
          PORT=3000
          ENV

      - name: Levantar infraestructura
        run: docker compose up -d mysql mongodb minio keycloak mailpit

      - name: Esperar MySQL
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T mysql mysqladmin ping -u root -prootpassword --silent && echo "MySQL listo" && break
            echo "Intento $i/30..."
            sleep 5
          done

      - name: Esperar MongoDB
        run: |
          for i in $(seq 1 20); do
            docker compose exec -T mongodb mongosh --quiet --eval "db.adminCommand('ping').ok" && echo "MongoDB listo" && break
            echo "Intento $i/20..."
            sleep 5
          done

      - name: Esperar Keycloak
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health/ready && echo "Keycloak listo" && break
            echo "Intento $i/30..."
            sleep 10
          done

      - name: Levantar backend
        run: docker compose --profile dev up -d backend-dev

      - name: Esperar backend
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:3000/health && echo "Backend listo" && break
            echo "Intento $i/20..."
            sleep 5
          done

      - name: Test — GET /health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health)
          [ "$STATUS" = "200" ] || (echo "FALLO: /health devolvió $STATUS" && exit 1)
          echo "✓ /health → $STATUS"

      - name: Test — GET /metrics
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/metrics)
          [ "$STATUS" = "200" ] || (echo "FALLO: /metrics devolvió $STATUS" && exit 1)
          echo "✓ /metrics → $STATUS"

      - name: Test — POST /api/auth/google sin token devuelve 400
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST http://localhost:3000/api/auth/google \
            -H "Content-Type: application/json" \
            -d '{}')
          [ "$STATUS" = "400" ] || (echo "FALLO: esperado 400, recibido $STATUS" && exit 1)
          echo "✓ /api/auth/google sin token → $STATUS"

      - name: Test — Keycloak OIDC discovery
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            http://localhost:8080/realms/iteso/.well-known/openid-configuration)
          [ "$STATUS" = "200" ] || (echo "FALLO: Keycloak OIDC → $STATUS" && exit 1)
          echo "✓ Keycloak OIDC discovery → $STATUS"

      - name: Test — MinIO health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9000/minio/health/live)
          [ "$STATUS" = "200" ] || (echo "FALLO: MinIO → $STATUS" && exit 1)
          echo "✓ MinIO health → $STATUS"

      - name: Test — ruta inexistente devuelve 404
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/ruta-que-no-existe)
          [ "$STATUS" = "404" ] || (echo "FALLO: esperado 404, recibido $STATUS" && exit 1)
          echo "✓ /api/ruta-inexistente → $STATUS"

      - name: Logs del backend si hay fallo
        if: failure()
        run: docker compose logs backend-dev --tail 60

      - name: Teardown
        if: always()
        run: docker compose --profile dev down -v

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 5: DAST — OWASP ZAP Baseline Scan
  # ──────────────────────────────────────────────────────────────────────────
  dast:
    name: DAST — OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    needs: [integration]
    # Corre solo si la integración pasó — necesita el backend levantado

    steps:
      - uses: actions/checkout@v4

      - name: Crear .env para CI
        run: |
          cat > .env << 'ENV'
          RDB_HOST=mysql
          RDB_USER=iteso_user
          RDB_PASSWORD=iteso_password
          RDB_NAME=iteso_db
          RDB_PORT=3306
          MONGO_URI=mongodb://root:rootpassword@mongodb:27017/iteso_nube?authSource=admin
          MINIO_ENDPOINT=http://minio:9000
          AWS_REGION=us-east-1
          AWS_ACCESS_KEY_ID=minioadmin
          AWS_SECRET_ACCESS_KEY=minioadmin123
          AWS_BUCKET_NAME=iteso-archivos
          KEYCLOAK_ISSUER=http://keycloak:8080/realms/iteso
          KEYCLOAK_CLIENT_ID=iteso-backend
          KEYCLOAK_CLIENT_SECRET=iteso-secret-local
          GOOGLE_CLIENT_ID=iteso-backend
          GOOGLE_CLIENT_SECRET=iteso-secret-local
          GOOGLE_REDIRECT_URI=http://localhost:3000/auth/google/callback
          JWT_SECRET=ci-secret-64-chars-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          SMTP_HOST=mailpit
          SMTP_PORT=1025
          EMAIL_SENDER=sistema@iteso.mx
          EMAIL_RECIPIENT=notificaciones@iteso.mx
          NODE_ENV=development
          PORT=3000
          ENV

      - name: Levantar infraestructura
        run: docker compose up -d mysql mongodb minio keycloak mailpit

      - name: Esperar MySQL
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T mysql mysqladmin ping -u root -prootpassword --silent && break
            sleep 5
          done

      - name: Esperar Keycloak
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health/ready && break
            sleep 10
          done

      - name: Levantar backend
        run: docker compose --profile dev up -d backend-dev

      - name: Esperar backend
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:3000/health && break
            sleep 5
          done

      - name: Crear directorio de reporte ZAP
        run: mkdir -p zap-report && chmod 777 zap-report

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j'
          # -a: incluye ajax spider
          # -j: genera reporte JSON además de HTML
        continue-on-error: true
        # continue-on-error: true porque ZAP sale con código 2 si encuentra
        # alertas de nivel WARN — no queremos que eso falle el pipeline,
        # solo queremos el reporte. Falla solo en alertas FAIL.

      - name: Subir reporte DAST
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-dast-report
          path: |
            report_html.html
            report_json.json

      - name: Mostrar resumen de alertas
        if: always()
        run: |
          if [ -f report_json.json ]; then
            echo "=== Resumen OWASP ZAP ==="
            python3 - << 'PY'
          import json, sys
          with open('report_json.json') as f:
              data = json.load(f)
          sites = data.get('site', [])
          total = {'High': 0, 'Medium': 0, 'Low': 0, 'Informational': 0}
          for site in sites:
              for alert in site.get('alerts', []):
                  risk = alert.get('riskdesc', '').split(' ')[0]
                  if risk in total:
                      total[risk] += 1
          print(f"High:          {total['High']}")
          print(f"Medium:        {total['Medium']}")
          print(f"Low:           {total['Low']}")
          print(f"Informational: {total['Informational']}")
          if total['High'] > 0:
              print("\n⚠️  Se encontraron alertas de nivel HIGH")
              sys.exit(1)
          else:
              print("\n✓ Sin alertas críticas (High)")
          PY
          fi

      - name: Teardown
        if: always()
        run: docker compose --profile dev down -v